# Copy to `viport.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# VIPORT_CONFIG selects a different config file.

[paths]
# Your own dump of Grand Theft Auto VI.     env: VIPORT_GAME_DIR
game_dir = 'D:\viport-data\game'

# Derived data. Default: %LOCALAPPDATA%\viport\cache.   env: VIPORT_CACHE_DIR
# cache_dir = 'D:\viport-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\viport\data.   env: VIPORT_DATA_DIR
# data_dir = 'D:\viport-data\data'

# AMD FidelityFX for PC: the folder with amd_fidelityfx_upscaler_dx12.dll
# (FidelityFX SDK, Kits/FidelityFX/signedbin). It upscales in place of a
# title's console build. Unset: the title's own.   env: VIPORT_FIDELITYFX_DIR
# fidelityfx_dir = 'D:\viport-data\fidelityfx'

# Other Xbox Series titles used to test platform-level code.
# env: VIPORT_TEST_TITLES (separated by ';')
test_titles = []
